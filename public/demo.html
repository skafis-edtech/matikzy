<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Skafis Tikz</title>
  <style>
    body { font-family: monospace; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; font-family: monospace; font-size: 14px; box-sizing: border-box; }
    button { margin-top: 0.5rem; padding: 0.4rem 1.2rem; font-size: 14px; cursor: pointer; }
    #output { margin-top: 1.5rem; min-height: 100px; border: 1px solid #ccc; padding: 1rem; position: relative;}
    #error { color: red; margin-top: 0.5rem; }
    label { font-size: 13px; color: #555; display: block; margin-top: 1rem; margin-bottom: 0.25rem; }
    #stats { display: flex; gap: 1.5rem; font-size: 13px; color: #555; margin-bottom: 1rem; flex-wrap: wrap; }
    #stats span { white-space: nowrap; }
    #stats b { color: #111; }
  </style>
</head>
<body>
  <h2>Skafis Tikz</h2>
  <div id="stats">Loading stats...</div>

  <label for="matikzy">Matikzy</label>
  <textarea id="matikzy" style="height:80px;" placeholder="interval: =-= [a] _+_ (b) =-= >x"></textarea>
  <button id="compile-btn">Compile to TikZ</button>
  <div id="compile-error" style="color:red;margin-top:0.25rem;"></div>

  <label for="tikz">TikZ</label>
  <textarea id="tikz" style="height:180px;">
\begin{document}
\begin{tikzpicture}[scale=1.5]

	\coordinate (A) at (-2,-1);
	\coordinate (B) at (-2,1);
	\coordinate (C) at (2,1);
	\coordinate (D) at (2,-1);

	\draw (A) -- (B) -- (C) -- (D) -- (A) -- (C);
	\draw (B) -- (D);

	\node[left, scale=1.5] at (A) {$A$};
	\node[left, scale=1.5] at (B) {$B$};
	\node[right, scale=1.5] at (C) {$C$};
	\node[right, scale=1.5] at (D) {$D$};
	\node[below, scale=1.5] at (0,0) {$O$};
	\node[below, scale=1.5] at (0,-1) {$x+4$};
	\node[left, scale=1.5] at (-2,0) {$x$};


\end{tikzpicture}
\end{document}
  </textarea>
  <br />
  <button id="render-btn">Render</button>
  <div id="error"></div>
  <div id="output"></div>

  <script type="module">
    import { compile } from "/matikzy.js";

    document.getElementById("compile-btn").addEventListener("click", compileMatikzy);
    document.getElementById("render-btn").addEventListener("click", render);

    function compileMatikzy() {
      const matikzy = document.getElementById("matikzy").value.trim();
      const compileError = document.getElementById("compile-error");
      compileError.textContent = "";
      try {
        document.getElementById("tikz").value = compile(matikzy);
      } catch (e) {
        compileError.textContent = e.message;
      }
    }

    async function render() {
      const tikz = document.getElementById("tikz").value;
      const error = document.getElementById("error");
      const output = document.getElementById("output");
      error.textContent = "";
      output.innerHTML = "Rendering...";
      try {
        const res = await fetch("/render", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lang: "tikz", content: tikz })
        });
        if (!res.ok) throw new Error(await res.text());
        output.innerHTML = await res.text();
        loadStats();
      } catch (e) {
        output.innerHTML = "";
        error.textContent = e.message;
      }
    }

    async function loadStats() {
      const el = document.getElementById("stats");
      try {
        const res = await fetch("/stats");
        if (!res.ok) throw new Error();
        const s = await res.json();
        const cacheRate = s.requests > 0 ? Math.round(s.cache_hits / s.requests * 100) : 0;
        el.innerHTML = [
          `<span>requests <b>${s.requests}</b></span>`,
          `<span>renders <b>${s.renders}</b></span>`,
          `<span>cache hits <b>${s.cache_hits}</b> (${cacheRate}%)</span>`,
          `<span>errors <b>${s.errors}</b></span>`,
          `<span>queue full <b>${s.queue_full}</b></span>`,
        ].join("");
      } catch {
        el.textContent = "Stats unavailable";
      }
    }

    loadStats();
  </script>
</body>
</html>
